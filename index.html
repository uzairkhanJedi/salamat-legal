<!-- This page is NOT the privacy policy any more. It is a redirect.

     The policy lives at https://outingapp.io/privacy, served from
     infrastructure/well-known/privacy/index.html in the app repo, and that is
     the URL the app itself opens. It is the only copy with legal effect.

     Why: on 2026-09-03 the policy existed in three places and PostHog
     analytics shipped with only two of them updated — the one the app links
     was missed, so for about twenty minutes the app collected under a policy
     that did not name the processor. One copy now.

     Since 2026-09-04 delete-account.html is ALSO a redirect, to
     outingapp.io/delete-account, which the privacy policy and the Play
     listing now link. join.html is the only page here that still serves
     content; it is unchanged. This repository is archived. -->

<link rel="canonical" href="https://outingapp.io/privacy">
<meta http-equiv="refresh" content="0; url=https://outingapp.io/privacy">
<style>
  body{margin:0;background:#f3f6f5;color:#0e1413;
       font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;line-height:1.55}

  h1{color:#006d5b;font-size:1.5rem;line-height:1.25;margin:0 0 1rem}

</style>
</head>

<main>
  <h1>Outing — Privacy Policy has moved</h1>
  <p>The current privacy policy is at
     <a href="https://outingapp.io/privacy"><strong>outingapp.io/privacy</strong></a>.</p>
  <p>You should be redirected automatically. If not, use the link above.</p>
  <p class="muted">Looking for something else?
     <a href="delete-account.html">Delete your account</a> ·
     <a href="join.html">Join an outing</a></p>
</main>
<script>location.replace("https://outingapp.io/privacy");</script>
